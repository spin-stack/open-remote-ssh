# Weekly and grouped, a week after a release (cooldown): one pull request per ecosystem. What
# versions.yaml pins (the Task `go tool task` runs) is not here: `versions check` says what is
# behind there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # pnpm, which this ecosystem reads.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The types of the oldest Node the code runs on: the tests' Node 22 (setup-node in the
      # workflows); VS Code's extension host is newer (Node 24 in 1.146). A newer major's types
      # let through an API neither has. Moved by hand, with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
