# Weekly and grouped, a week after a release (cooldown): one pull request per ecosystem. What
# versions.yaml pins (the Task `go tool task` runs) is not here: `versions check` says what is
# behind there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      # go-tools is ours: a release of it reaches every repository the week it is made.
      exclude: ["github.com/spin-stack/go-tools"]
    # go-tools is indirect, required for the commands go.mod takes as tools, and Dependabot moves
    # only direct requirements unless allowed; the entries are OR'ed, so the rest stay as they were.
    allow:
      - dependency-type: direct
      - dependency-name: github.com/spin-stack/go-tools
        dependency-type: all
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # pnpm, which this ecosystem reads.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The types of the oldest Node the code runs on: the tests' Node 22 (setup-node in the
      # workflows); VS Code's extension host is newer (Node 24 in 1.146). A newer major's types
      # let through an API neither has. Moved by hand, with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
