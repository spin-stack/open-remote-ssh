# What the extension pins from outside it, but its npm packages (pnpm-lock.yaml), go-tools' cmd/task
# (go.mod) and the actions the workflows run (Dependabot's). It is go-tools' versions format:
# `versions version <name>` reads an entry from a task, `versions check` says what is behind.

- name: cosign
  kind: module
  source: github.com/sigstore/cosign/v3/cmd/cosign
  version: v3.1.4
  track: github-release https://github.com/sigstore/cosign
  note: >-
    What signs a release's SHA256SUMS keyless in task publish:github, run with go run at this
    version, so the checksum database holds it to its bytes and no runner needs it installed.
    vscode-spinbox pins it too: keep the two at one version.

- name: task
  kind: download
  source: https://github.com/go-task/task/releases/download/v{version}/task_{os}_{arch}.tar.gz
  version: 3.54.0
  pins:
    linux/amd64: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
    linux/arm64: d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b
    darwin/amd64: 0543b0844a725814c0412d3f4bed12873ce9ed0da207b15775f63a97d734aac0
    darwin/arm64: 12a69fcf37bb8d5bc9150c44f9a936775b73e59ff044c2c245232f198c135637
  track: github-release https://github.com/go-task/task
  note: >-
    The Task `go tool task` runs (go-tools' cmd/task), for every platform a person or a runner
    works on: no repository compiles it. vscode-spinbox pins it too: keep the two at one version.
